services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-cuda}
    volumes:
      - \\wsl.localhost\Ubuntu\home\jesse\ece\open-webui:/app/backend/data
    ports:
      - ${OPEN_WEBUI_PORT-3012}:8080
    environment:
      - 'WEBUI_SECRET_KEY='
      - 'WEBUI_NAME=${WEBUI_NAME}'
      - 'VECTOR_DB=${VECTOR_DB}'
      - 'QDRANT_URI=${QDRANT_URI}'
      - 'QDRANT_API_KEY=${QDRANT_API_KEY}'
      - 'AIOHTTP_CLIENT_TIMEOUT=${AIOHTTP_CLIENT_TIMEOUT-6000}'
      - 'DATABASE_URL=${DATABASE_URL}'
      - 'ENABLE_WEBSOCKET_SUPPORT=${ENABLE_WEBSOCKET_SUPPORT-true}'
      - 'WEBSOCKET_MANAGER=${WEBSOCKET_MANAGER-redis}'
      - 'WEBSOCKET_REDIS_URL=${WEBSOCKET_REDIS_URL}'
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - open-webui-shared
      - internal
    restart: unless-stopped
  redis:
    image: docker.io/valkey/valkey:8.0.1-alpine
    volumes:
      - redis-data:/data
    command: "valkey-server --save 30 1"
    healthcheck:
      test: "[ $$(valkey-cli ping) = 'PONG' ]"
      start_period: 5s
      interval: 1s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    ports:
      - "${REDIS_PORT-6354}:6379"
    networks:
      - internal

volumes:
  redis-data: {}

networks:
  open-webui-shared:
    external: true
  internal:
    driver: bridge
