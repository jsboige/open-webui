services:
  open-webui:
    build:
      context: .
      args:
        OLLAMA_BASE_URL: '/ollama'
      dockerfile: Dockerfile
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-main}
    volumes:
      - \\wsl.localhost\Ubuntu\home\jesse\open-webui:/app/backend/data
    ports:
      -  ${OPEN_WEBUI_PORT-3000}:8080
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      - 'WEBUI_SECRET_KEY='
      - 'WEBUI_NAME=${WEBUI_NAME}'
      - 'VECTOR_DB=${VECTOR_DB}'
      - 'QDRANT_URI=${QDRANT_URI}'
      - 'QDRANT_API_KEY=${QDRANT_API_KEY}'
      - 'AIOHTTP_CLIENT_TIMEOUT=${AIOHTTP_CLIENT_TIMEOUT-6000}'
      - 'DATABASE_URL=${DATABASE_URL}'
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - open-webui-shared
    restart: unless-stopped
  tika:
    image: apache/tika:latest-full
    ports:
      - "9917:9998"
    restart: unless-stopped
  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    volumes:
      - pipelines-data:/app/pipelines
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
    ports:
      - "8880:8880"
    volumes:
      - kokoro-data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
  whisper-stt-adapter:
    build:
      context: ./whisper-webui-adapter
      dockerfile: Dockerfile
    environment:
      - 'WHISPER_WEBUI_BASE_URL=https://whisper-webui.myia.io'
      - 'WHISPER_WEBUI_USERNAME=admin'
      - 'WHISPER_WEBUI_PASSWORD=goldman'
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
  redis:
    image: docker.io/valkey/valkey:8.0.1-alpine
    volumes:
      - redis-data:/data
    command: "valkey-server --save 30 1"
    healthcheck:
      test: "[ $$(valkey-cli ping) = 'PONG' ]"
      start_period: 5s
      interval: 1s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    ports:
      - "6351:6379"
volumes:
  open-webui: {}
  pipelines-data: {}
  kokoro-data: {}
  redis-data: {}

networks:
  open-webui-shared:
    external: true