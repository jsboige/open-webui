services:
  open-webui:
    build:
      context: .
      args:
        OLLAMA_BASE_URL: '/ollama'
      dockerfile: Dockerfile
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-main}
    volumes:
      - \\wsl.localhost\Ubuntu\home\jesse\open-webui:/app/backend/data
    ports:
      -  ${OPEN_WEBUI_PORT-3000}:8080
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      - 'WEBUI_SECRET_KEY='
      - 'WEBUI_NAME=${WEBUI_NAME}'
      - 'VECTOR_DB=${VECTOR_DB}'
      - 'AIOHTTP_CLIENT_TIMEOUT=${AIOHTTP_CLIENT_TIMEOUT-6000}'
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
  tika:
    image: apache/tika:latest-full
    ports:
      - "9917:9998"
    restart: unless-stopped
  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    volumes:
      - pipelines-data:/app/pipelines
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
  redis:
    image: docker.io/valkey/valkey:8.0.1-alpine
    volumes:
      - redis-data:/data
    command: "valkey-server --save 30 1"
    healthcheck:
      test: "[ $$(valkey-cli ping) = 'PONG' ]"
      start_period: 5s
      interval: 1s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    ports:
      - "6351:6379"
volumes:
  open-webui: {}
  pipelines-data: {}
  redis-data: {}