# DEPRECATED: This standalone file is superseded by docker-compose-infra.yaml
# which combines PostgreSQL + Tika + Redis into a single project (open-webui-infra).
# Use: docker compose -p open-webui-infra -f docker-compose-infra.yaml up -d

services:
  tika:
    image: apache/tika:latest-full
    ports:
      - "9917:9998"
    networks:
      - open-webui-shared
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9998"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  open-webui-shared:
    external: true
